<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mô Phỏng Thí Nghiệm: Tổng Hợp Ester (Isoamyl Acetate)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom animations */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px) rotate(-5deg); }
            50% { transform: translateX(5px) rotate(5deg); }
            75% { transform: translateX(-5px) rotate(-5deg); }
        }
        .animate-shake {
            animation: shake 0.5s ease-in-out;
        }
        @keyframes bubble {
            0% { transform: translateY(0) scale(1); opacity: 0.8; }
            100% { transform: translateY(-20px) scale(1.5); opacity: 0; }
        }
        .bubble-effect::after {
            content: '🫧';
            position: absolute;
            animation: bubble 1s infinite;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4 font-sans text-gray-800">

    <div class="max-w-5xl w-full bg-white rounded-2xl shadow-2xl overflow-hidden flex flex-col md:flex-row h-[800px] md:h-[600px]">
        
        <!-- Bảng điều khiển / Hướng dẫn (Bên trái) -->
        <div class="w-full md:w-1/3 bg-slate-800 text-white p-6 flex flex-col h-full border-r-4 border-slate-900">
            <h1 class="text-2xl font-bold mb-4 text-yellow-400 border-b border-slate-600 pb-2">Lab Ảo: Tổng hợp Ester</h1>
            
            <div class="flex-grow flex flex-col gap-4 overflow-y-auto pr-2" id="log-container">
                <div class="bg-slate-700 p-4 rounded-lg shadow border-l-4 border-blue-500">
                    <h2 class="font-semibold text-blue-300">Hướng dẫn hiện tại:</h2>
                    <p id="current-instruction" class="mt-2 text-sm leading-relaxed">
                        Bước 1: Hãy thêm Isoamyl Alcohol và Acetic Acid vào ống nghiệm chính để tạo hỗn hợp phản ứng.
                    </p>
                </div>

                <div class="bg-slate-900 p-4 rounded-lg flex-grow overflow-y-auto border border-slate-700">
                    <h3 class="font-semibold text-gray-400 mb-2 text-sm uppercase tracking-wider">Nhật ký thí nghiệm</h3>
                    <ul id="experiment-log" class="text-sm space-y-2 font-mono">
                        <li class="text-green-400">> Sẵn sàng...</li>
                    </ul>
                </div>
            </div>
            
            <button id="reset-btn" class="mt-4 w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 px-4 rounded-xl transition shadow-lg flex items-center justify-center gap-2">
                <span>🔄</span> Làm lại từ đầu
            </button>
        </div>

        <!-- Bàn thí nghiệm (Bên phải) -->
        <div class="w-full md:w-2/3 bg-slate-200 p-6 flex flex-col relative h-full">
            
            <!-- Khu vực Ống nghiệm trung tâm -->
            <div class="flex-grow flex items-center justify-center relative border-4 border-dashed border-slate-600 rounded-xl mb-6 bg-slate-800 shadow-inner overflow-hidden">
                <!-- Ánh sáng nền mờ tạo độ sâu -->
                <div class="absolute inset-0 bg-gradient-to-b from-slate-700 to-slate-900 pointer-events-none"></div>

                <div id="main-test-tube" class="w-24 h-64 border-4 border-white/60 bg-white/10 rounded-b-full rounded-t-sm shadow-[inset_0_-10px_20px_rgba(255,255,255,0.2)] relative flex items-end justify-center overflow-hidden transition-all duration-500 backdrop-blur-md z-20">
                    <!-- Chất lỏng bên trong -->
                    <div id="liquid-level" class="w-full h-0 bg-transparent transition-all duration-1000 flex items-center justify-center relative">
                        <span id="result-emoji" class="text-4xl opacity-0 transition-opacity duration-1000 absolute"></span>
                    </div>
                </div>
                
                <!-- Hiệu ứng ngọn lửa / làm lạnh -->
                <div id="environment-effect" class="absolute bottom-4 text-6xl opacity-0 transition-opacity duration-500 pointer-events-none z-10 drop-shadow-2xl">
                    <!-- Icon lửa hoặc băng sẽ hiện ở đây -->
                </div>
            </div>

            <!-- Kệ Hóa Chất & Dụng cụ -->
            <div class="h-1/3 bg-slate-300 rounded-xl p-4 shadow-inner">
                <h3 class="text-center font-bold text-slate-600 mb-3 uppercase tracking-wider text-sm">Hóa chất & Dụng cụ</h3>
                <div class="grid grid-cols-3 md:grid-cols-6 gap-3">
                    <!-- Các nút tương tác -->
                    <button class="chem-btn flex flex-col items-center justify-center p-2 bg-white rounded-lg shadow hover:bg-yellow-50 hover:shadow-md transition active:scale-95" data-item="alcohol">
                        <span class="text-3xl">🧴</span>
                        <span class="text-xs font-semibold mt-1 text-center">Isoamyl Alcohol</span>
                    </button>
                    <button class="chem-btn flex flex-col items-center justify-center p-2 bg-white rounded-lg shadow hover:bg-yellow-50 hover:shadow-md transition active:scale-95" data-item="acetic">
                        <span class="text-3xl">🫙</span>
                        <span class="text-xs font-semibold mt-1 text-center">Acetic Acid</span>
                    </button>
                    <button class="chem-btn flex flex-col items-center justify-center p-2 bg-white rounded-lg shadow hover:bg-yellow-50 hover:shadow-md transition active:scale-95" data-item="h2so4">
                        <span class="text-3xl">💧</span>
                        <span class="text-xs font-semibold mt-1 text-center">H2SO4 (Xúc tác)</span>
                    </button>
                    <button class="chem-btn flex flex-col items-center justify-center p-2 bg-white rounded-lg shadow hover:bg-yellow-50 hover:shadow-md transition active:scale-95" data-item="water">
                        <span class="text-3xl">🚰</span>
                        <span class="text-xs font-semibold mt-1 text-center">Nước Cất</span>
                    </button>
                    <button class="action-btn flex flex-col items-center justify-center p-2 bg-red-100 border-2 border-red-200 rounded-lg shadow hover:bg-red-200 hover:shadow-md transition active:scale-95" data-action="heat">
                        <span class="text-3xl">🔥</span>
                        <span class="text-xs font-semibold mt-1 text-center">Bếp Đun</span>
                    </button>
                    <button class="action-btn flex flex-col items-center justify-center p-2 bg-blue-100 border-2 border-blue-200 rounded-lg shadow hover:bg-blue-200 hover:shadow-md transition active:scale-95" data-action="cool">
                        <span class="text-3xl">🧊</span>
                        <span class="text-xs font-semibold mt-1 text-center">Cốc Nước Đá</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            try {
                // DOM Elements
                const logList = document.getElementById('experiment-log');
                const currentInstruction = document.getElementById('current-instruction');
                const testTube = document.getElementById('main-test-tube');
                const liquidLevel = document.getElementById('liquid-level');
                const resultEmoji = document.getElementById('result-emoji');
                const envEffect = document.getElementById('environment-effect');
                const chemButtons = document.querySelectorAll('.chem-btn');
                const actionButtons = document.querySelectorAll('.action-btn');
                const resetBtn = document.getElementById('reset-btn');

                // Game State
                let currentStep = 1;
                let addedAlcohol = false;
                let addedAcetic = false;
                
                // Helper: Log message
                function addLog(message, type = 'info') {
                    const li = document.createElement('li');
                    li.textContent = `> ${message}`;
                    if (type === 'error') li.className = 'text-red-400';
                    else if (type === 'success') li.className = 'text-yellow-400 font-bold';
                    else li.className = 'text-slate-300';
                    logList.appendChild(li);
                    logList.parentElement.scrollTop = logList.parentElement.scrollHeight;
                }

                // Helper: Update Instruction
                function updateInstruction(text) {
                    currentInstruction.textContent = text;
                    currentInstruction.parentElement.classList.add('animate-pulse');
                    setTimeout(() => currentInstruction.parentElement.classList.remove('animate-pulse'), 1000);
                }

                // Interaction Logic
                function handleItemClick(item) {
                    if (currentStep === 1) {
                        if (item === 'alcohol' && !addedAlcohol) {
                            addedAlcohol = true;
                            liquidLevel.style.height = '15%';
                            liquidLevel.style.backgroundColor = 'rgba(200, 200, 200, 0.5)'; // Clear liquid
                            addLog("Đã thêm Isoamyl Alcohol.");
                        } else if (item === 'acetic' && !addedAcetic) {
                            addedAcetic = true;
                            liquidLevel.style.height = addedAlcohol ? '30%' : '15%';
                            liquidLevel.style.backgroundColor = 'rgba(200, 200, 200, 0.5)';
                            addLog("Đã thêm Acetic Acid.");
                        } else if (item === 'alcohol' || item === 'acetic') {
                            addLog("Bạn đã thêm chất này rồi.", 'error');
                        } else {
                            addLog("Sai hóa chất! Hãy xem lại hướng dẫn.", 'error');
                            testTube.classList.add('animate-shake');
                            setTimeout(() => testTube.classList.remove('animate-shake'), 500);
                        }

                        if (addedAlcohol && addedAcetic) {
                            currentStep = 2;
                            addLog("Đã trộn Alcohol và Acetic Acid.", 'success');
                            updateInstruction("Bước 2: Thêm vài giọt Sulfuric Acid (H2SO4) làm xúc tác.");
                        }
                    } 
                    else if (currentStep === 2) {
                        if (item === 'h2so4') {
                            liquidLevel.style.height = '35%';
                            // Tỏa nhiệt nhẹ khi cho axit
                            testTube.classList.add('animate-shake');
                            addLog("Đã thêm H2SO4. Hỗn hợp tỏa nhiệt nhẹ.");
                            setTimeout(() => {
                                testTube.classList.remove('animate-shake');
                                currentStep = 3;
                                addLog("Sẵn sàng cho phản ứng.", 'success');
                                updateInstruction("Bước 3: Đun cách thủy hỗn hợp để phản ứng este hóa xảy ra.");
                            }, 800);
                        } else {
                            addLog("Sai hóa chất! Cần thêm chất xúc tác.", 'error');
                        }
                    }
                    else if (currentStep === 4) {
                        if (item === 'water') {
                            liquidLevel.style.height = '70%';
                            liquidLevel.style.backgroundColor = 'rgba(255, 255, 200, 0.8)'; // Lớp este nổi lên
                            
                            // Hiển thị kết quả
                            resultEmoji.textContent = '🍌';
                            resultEmoji.classList.remove('opacity-0');
                            resultEmoji.classList.add('opacity-100');
                            
                            addLog("Đã thêm nước cất. Lớp este nổi lên trên.", 'success');
                            addLog("Thành công! Mùi chuối chín xuất hiện (Isoamyl Acetate).", 'success');
                            updateInstruction("Thí nghiệm hoàn thành xuất sắc! 🎉");
                            currentStep = 5; // End
                        } else {
                            addLog("Cần thêm nước để tách este.", 'error');
                        }
                    }
                    else {
                        addLog("Không thể thêm chất này vào lúc này.", 'error');
                    }
                }

                function handleActionClick(action) {
                    if (currentStep === 3) {
                        if (action === 'heat') {
                            envEffect.textContent = '🔥';
                            envEffect.classList.remove('opacity-0');
                            envEffect.classList.add('opacity-100');
                            liquidLevel.classList.add('bubble-effect');
                            liquidLevel.style.backgroundColor = 'rgba(230, 230, 180, 0.6)'; // Đổi màu nhẹ khi đun
                            
                            addLog("Đang đun cách thủy...");
                            
                            // Giả lập thời gian đun
                            setTimeout(() => {
                                envEffect.classList.add('opacity-0');
                                envEffect.classList.remove('opacity-100');
                                liquidLevel.classList.remove('bubble-effect');
                                
                                currentStep = 4;
                                addLog("Đã đun xong.", 'success');
                                updateInstruction("Bước 4: Làm lạnh hỗn hợp bằng cốc nước đá, sau đó thêm nước cất để tách este.");
                            }, 3000);
                        } else {
                            addLog("Cần đun nóng hỗn hợp trước.", 'error');
                        }
                    }
                    else if (currentStep === 4) {
                        if (action === 'cool') {
                            envEffect.textContent = '🧊';
                            envEffect.classList.remove('opacity-0');
                            envEffect.classList.add('opacity-100');
                            
                            addLog("Đang làm lạnh hỗn hợp...");
                            
                            setTimeout(() => {
                                envEffect.classList.add('opacity-0');
                                envEffect.classList.remove('opacity-100');
                                addLog("Hỗn hợp đã nguội. Bây giờ hãy thêm nước cất.");
                                // Note: We stay in step 4 until water is added
                            }, 1500);
                        } else {
                             addLog("Hãy làm lạnh hỗn hợp trước hoặc thêm nước.", 'info');
                        }
                    }
                    else {
                         addLog("Thao tác này chưa cần thiết lúc này.", 'info');
                    }
                }

                // Event Listeners
                chemButtons.forEach(btn => {
                    btn.addEventListener('click', () => handleItemClick(btn.dataset.item));
                });

                actionButtons.forEach(btn => {
                    btn.addEventListener('click', () => handleActionClick(btn.dataset.action));
                });

                resetBtn.addEventListener('click', () => {
                    currentStep = 1;
                    addedAlcohol = false;
                    addedAcetic = false;
                    
                    liquidLevel.style.height = '0%';
                    liquidLevel.style.backgroundColor = 'transparent';
                    liquidLevel.classList.remove('bubble-effect');
                    
                    resultEmoji.classList.add('opacity-0');
                    resultEmoji.classList.remove('opacity-100');
                    
                    envEffect.classList.add('opacity-0');
                    
                    logList.innerHTML = '<li class="text-green-400">> Hệ thống đã làm mới. Sẵn sàng...</li>';
                    updateInstruction("Bước 1: Hãy thêm Isoamyl Alcohol và Acetic Acid vào ống nghiệm chính để tạo hỗn hợp phản ứng.");
                });

            } catch (error) {
                console.error("Game Initialization Error: ", error);
                document.body.innerHTML = `<div class="p-10 text-red-500 font-bold">Lỗi khởi tạo game: ${error.message}</div>`;
            }
        });
    </script>
</body>
</html>
